<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clean Translate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main>
      <label class="checkbox">
        <span>Enabled</span>
        <input id="enabled" type="checkbox" />
      </label>
      <label class="checkbox">
        <span>Chinese (with Pinyin)</span>
        <input id="pinyin" type="checkbox" />
      </label>
      <label>
        <span>Source</span>
        <input id="sourceLang" placeholder="auto or zh" />
      </label>
      <label>
        <span>Target order</span>
        <input id="targetLangs" placeholder="es, en" />
      </label>
      <label>
        <span>Exclude</span>
        <input id="excludeLangs" placeholder="en, es" />
      </label>
      <button id="apply">Apply</button>
      <button id="undo">Undo</button>
      <a href="../options/index.html" target="_blank">Options…</a>
    </main>
  <script src="index.js"></script>
</body>
</html>
