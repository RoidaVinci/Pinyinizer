<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clean Translate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
  <!-- Global On/Off (centered, elegant) -->
  <div class="toggle-row" id="toggleRow">
    <span class="toggle-label off">Off</span>
    <label class="switch" aria-label="Enable extension">
      <input id="enabled" type="checkbox" role="switch" />
      <span class="slider"></span>
    </label>
    <span class="toggle-label on">On</span>
  </div>

    <fieldset>
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="translate" id="modeTranslate" /> Translate</label>
      <label><input type="radio" name="mode" value="pinyin" id="modePinyin" /> Pinyin</label>
    </fieldset>

    <!-- Pinyin-only -->
    <section id="pinyinSection">
      <label style="margin-bottom:16px;">
        <span>Also show English</span>
        <input id="annotateShowEnglish" type="checkbox" />
      </label>

      <!-- NEW: scales (apply when English is NOT shown) -->
      <label class="stack" style="margin-bottom:16px;">
        <span>Hanzi scale (no English)</span>
        <input id="hanziScale" type="range" min="0.30" max="1.20" step="0.01" />
        <small><code id="hanziScaleVal"></code></small>
      </label>
      <label class="stack" style="margin-bottom:16px;">
        <span>Pinyin scale (no English)</span>
        <input id="pinyinScale" type="range" min="0.30" max="1.20" step="0.01" />
        <small><code id="pinyinScaleVal"></code></small>
      </label>
    </section>

    <!-- Translate-only -->
    <section id="translateSection">
      <label style="margin-bottom:16px;">
        <span>Source</span>
        <input id="sourceLang" placeholder="auto or zh" />
      </label>
      <label style="margin-bottom:16px;">
        <span>Target order</span>
        <input id="targetLangs" placeholder="es, en" />
      </label>
      <label style="margin-bottom:16px;">
        <span>Exclude</span>
        <input id="excludeLangs" placeholder="en, es" />
      </label>
    </section>

    <button id="apply">Apply</button>
    <button id="undo">Deactivate</button>
    <a href="../options/index.html" target="_blank">Options…</a>
  </main>
  <script src="index.js"></script>
</body>
</html>
