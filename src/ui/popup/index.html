<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clean Translate</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <fieldset>
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="translate" id="modeTranslate" /> Translate</label>
      <label><input type="radio" name="mode" value="pinyin" id="modePinyin" /> Pinyin</label>
    </fieldset>

    <!-- Pinyin-only -->
    <section id="pinyinSection">
      <label>
        <span>Also show English</span>
        <input id="annotateShowEnglish" type="checkbox" />
      </label>
    </section>

    <!-- Translate-only -->
    <section id="translateSection">
      <label>
        <span>Enabled</span>
        <input id="enabled" type="checkbox" />
      </label>
      <label>
        <span>Source</span>
        <input id="sourceLang" placeholder="auto or zh" />
      </label>
      <label>
        <span>Target order</span>
        <input id="targetLangs" placeholder="es, en" />
      </label>
      <label>
        <span>Exclude</span>
        <input id="excludeLangs" placeholder="en, es" />
      </label>
    </section>

    <button id="apply">Apply</button>
    <button id="undo">Undo</button>
    <a href="../options/index.html" target="_blank">Options…</a>
  </main>
  <script src="index.js"></script>
</body>
</html>
