<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clean Translate — Options</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Clean Translate — Options</h1>

    <fieldset>
      <legend>Mode</legend>
      <label><input type="radio" name="mode" value="translate" id="modeTranslate" /> Translate</label>
      <label><input type="radio" name="mode" value="pinyin" id="modePinyin" /> Pinyin (Hanzi → Hanzi + pinyin)</label>
    </fieldset>

    <!-- Pinyin-only options -->
    <section id="pinyinSection">
      <h2>Pinyin options</h2>
      <label>
        <span>Also show English (keep English after Hanzi)</span>
        <input id="annotateShowEnglish" type="checkbox" />
      </label>
    <label class="stack" style="margin-bottom:16px;">
    <span>Pinyin provider</span>
    <select id="pinyinProvider">
      <option value="pinyin_pro">Pinyin-pro (offline, faster)</option>
      <option value="google_free">Google (free)</option>
   </select>
  </label>

      <!-- NEW: scales for no-English layout -->
      <label style="margin-bottom:16px;">
        <span>Hanzi scale (no English)</span>
        <input id="hanziScale" type="range" min="0.30" max="1.20" step="0.01" />
        <small><code id="hanziScaleVal"></code></small>
      </label>
      <label style="margin-bottom:16px;">
        <span>Pinyin scale (no English)</span>
        <input id="pinyinScale" type="range" min="0.30" max="1.20" step="0.01" />
        <small><code id="pinyinScaleVal"></code></small>
      </label>
    </section>

    <!-- Translate-only options -->
    <section id="translateSection">
      <label>
        <span>Enabled</span>
        <input id="enabled" type="checkbox" />
      </label>

      <label style="margin-bottom:16px;">
        <span>Target languages</span>
        <input id="targetLangs" placeholder="es, en" />
      </label>
      <label style="margin-bottom:16px;">
        <span>Source language</span>
        <input id="sourceLang" placeholder="auto (or zh, en, ...)" />
      </label>
      <label style="margin-bottom:16px;">
        <span>Exclude languages</span>
        <input id="excludeLangs" placeholder="en, es" />
      </label>

      <label>
        <span>Provider</span>
        <select id="provider">
          <option value="mock">Mock (dev)</option>
          <option value="http">HTTP API</option>
          <option value="google_free">Google (free, no key)</option>
          <option value="nllb">NLLB (offline, safe)</option>
        </select>
      </label>

      <section>
        <h2>Glossary</h2>
        <label>
          <span>Do Not Translate (comma separated)</span>
          <input id="glossaryDnt" placeholder="Brand, API, ProductX" />
        </label>
      </section>
    </section>

    <div class="actions">
      <button id="save">Save</button>
      <span id="status"></span>
    </div>
  </main>
  <script src="index.js"></script>
</body>
</html>
